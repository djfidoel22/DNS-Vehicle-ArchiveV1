@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--card:#1c1b18;--tx:#f1ece0;--mu:#9a927f;--ac:#d4af37;--onac:#111;--bd:#35322a;--dg:#ff8a80}}

*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 14px 40px}

input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px}

button,.btn{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 14px;cursor:pointer;display:inline-block}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.fld{display:grid;grid-template-columns:minmax(90px,32%) 1fr auto;gap:8px;margin-bottom:8px;align-items:start}
.x{padding:9px 12px}

function boardSec(n){n.boards=n.boards||[];const m=path[1],y=path[2],at=i=>`data-m="${m}" data-y="${y}" data-i="${i}"`;return `<h3>Board number</h3>${n.boards.map((r,i)=>`<div class="step"><div class="row"><input data-a="gn" ${at(i)} value="${esc(r.board)}" placeholder="Board number" style="flex:1;min-width:140px;width:auto"><button class="x dg" data-a="gd" ${at(i)}>×</button></div><div class="row" style="margin-top:8px">${r.photo?`<img src="${r.photo}" alt="" data-a="gv" ${at(i)} style="width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);cursor:pointer">`:''}<label class="btn pf">${r.photo?'Change key photo':'+ Key photo'}<input type="file" accept="image/*" data-a="gp" ${at(i)}></label><label class="btn pf">📷<input type="file" accept="image/*" capture="environment" data-a="gp" ${at(i)}></label></div></div>`).join('')}<button data-a="ga" ${at(0)}>+ Add board number</button>`}
function boardView(b){b.boards=b.boards||[];const f=bflt.toLowerCase(),all=allBoards(b),list=all.filter(x=>!f||(x.m.name+' '+x.y.name+' '+x.r.board).toLowerCase().includes(f)),yrs=m=>{const k=b.kids.find(x=>x.name===m);return k?k.kids.map(y=>y.name):[]},at=(m,y,i)=>`data-m="${m}" data-y="${y}" data-i="${i}"`,im='style="width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);cursor:pointer"';
 return `<button class="pri" data-a="bb">← Back</button><div class="row" style="margin:12px 0">${badge(b,40)}<h2>${esc(b.name)} · Board numbers</h2></div>
<input id="bf" placeholder="Filter by model, year or board number…" value="${esc(bflt)}" style="margin-bottom:10px">
<div class="empty">${all.length} board number${all.length===1?'':'s'} saved in ${esc(b.name)}. They are saved inside each year, in the Board number section.</div>
<div class="tw"><table><thead><tr><th>Model</th><th>Year</th><th>Board number</th><th>Key photo</th><th></th></tr></thead><tbody>${list.map(({m,y,r,i})=>`<tr><td>${esc(m.name)}</td><td>${esc(y.name)}</td><td><input data-a="gn" ${at(m.id,y.id,i)} value="${esc(r.board)}" placeholder="Board number"></td><td>${r.photo?`<img src="${r.photo}" alt="" data-a="gv" ${at(m.id,y.id,i)}>`:''}<label class="btn pf">${r.photo?'Change':'+ Photo'}<input type="file" accept="image/*" data-a="gp" ${at(m.id,y.id,i)}></label><label class="btn pf">📷<input type="file" accept="image/*" capture="environment" data-a="gp" ${at(m.id,y.id,i)}></label></td><td><div class="row"><button data-a="go" ${at(m.id,y.id,i)}>Open year</button><button class="dg" data-a="gd" ${at(m.id,y.id,i)}>Delete</button></div></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nothing found.</td></tr>'}</tbody></table></div>
<h3>Add new</h3>${b.boards.map((r,i)=>`<div class="step"><div class="row"><select data-a="bm" data-i="${i}" style="width:auto;flex:none"><option value="">Model…</option>${sorted(b.kids,1).map(k=>`<option${k.name===r.model?' selected':''}>${esc(k.name)}</option>`).join('')}</select><input data-a="by" data-i="${i}" value="${esc(r.year)}" list="yl${i}" placeholder="Year" style="width:110px"><datalist id="yl${i}">${yrs(r.model).map(y=>`<option value="${esc(y)}">`).join('')}</datalist><input data-a="bn" data-i="${i}" value="${esc(r.board)}" placeholder="Board number" style="flex:1;min-width:130px;width:auto"></div><div class="row" style="margin-top:8px">${r.photo?`<img src="${r.photo}" alt="" data-a="bv" data-i="${i}" ${im}>`:''}<label class="btn pf">${r.photo?'Change photo':'+ Key photo'}<input type="file" accept="image/*" data-a="bp" data-i="${i}"></label><label class="btn pf">📷<input type="file" accept="image/*" capture="environment" data-a="bp" data-i="${i}"></label><span class="sp"></span><button class="pri" data-a="bsv" data-i="${i}">Save to year</button><button class="x dg" data-a="bx" data-i="${i}">×</button></div></div>`).join('')}<button class="pri" data-a="br">+ Add row</button>`}
function oldBoardView(b){b.boards=b.boards||[];const f=bflt.toLowerCase(),yrs=m=>{const k=b.kids.find(x=>x.name===m);return k?k.kids.map(y=>y.name):[]};
 const rows=b.boards.map((r,i)=>({r,i})).filter(({r})=>!f||(r.model+' '+r.year+' '+r.board).toLowerCase().includes(f));
 return `<button class="pri" data-a="bb">← Back</button><div class="row" style="margin:12px 0">${badge(b,40)}<h2>${esc(b.name)} · Board numbers</h2></div>
<input id="bf" placeholder="Filter by model, year or board number…" value="${esc(bflt)}" style="margin-bottom:10px">
<div class="tw"><table><thead><tr><th>Model</th><th>Year</th><th>Board number</th><th>Key photo</th><th></th></tr></thead><tbody>
${rows.map(({r,i})=>`<tr><td><select data-a="bm" data-i="${i}"><option value="">Choose…</option>${sorted(b.kids,1).map(k=>`<option${k.name===r.model?' selected':''}>${esc(k.name)}</option>`).join('')}${r.model&&!b.kids.some(k=>k.name===r.model)?`<option selected>${esc(r.model)}</option>`:''}</select></td><td><input data-a="by" data-i="${i}" value="${esc(r.year)}" list="yl${i}" placeholder="Year"><datalist id="yl${i}">${yrs(r.model).map(y=>`<option value="${esc(y)}">`).join('')}</datalist></td><td><input data-a="bn" data-i="${i}" value="${esc(r.board)}" placeholder="Board number"></td><td>${r.photo?`<img src="${r.photo}" alt="" data-a="bv" data-i="${i}">`:''}<label class="btn pf">${r.photo?'Change':'+ Photo'}<input type="file" accept="image/*" data-a="bp" data-i="${i}"></label><label class="btn pf">📷<input type="file" accept="image/*" capture="environment" data-a="bp" data-i="${i}"></label></td><td><button class="x dg" data-a="bx" data-i="${i}">×</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No rows yet.</td></tr>'}

function badge(n,s){s=s||44;if(n.logo)return `<img class="lg" src="${n.logo}" alt="" style="width:${s}px;height:${s}px">`;let h=0;for(const ch of n.name)h=(h*31+ch.charCodeAt(0))%360;const w=n.name.replace(/[^A-Za-z0-9 ]/g,'').split(' ').filter(Boolean),t=(w.length>1?w[0][0]+w[1][0]:n.name.slice(0,2)).toUpperCase();return `<svg class="lg" width="${s}" height="${s}" viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="hsl(${h} 45% 32%)" stroke="#d4af37" stroke-width="1.5"/><text x="20" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" font-family="system-ui,sans-serif">${esc(t)}</text></svg>`}
function chain(){const out=[];let list=db.brands;for(const id of path){const n=list.find(x=>x.id===id);if(!n)break;out.push(n);list=n.kids}return out}
const sorted=(l,d)=>[...l].sort((a,b)=>d===2?b.name.localeCompare(a.name,undefined,{numeric:true}):a.name.localeCompare(b.name,undefined,{numeric:true}));

 return `<section class="card"><div class="row"><h2>${esc(n.name)}</h2><span class="sp"></span><button data-a="ren">Rename</button>${d===3?'<button data-a="copy" data-id="'+n.id+'">Copy</button>':''}<button class="dg" data-a="del">Delete</button></div>

function kidsView(n,d){

function find(list,q,trail,out){for(const n of list){const t=trail.concat(n);const txt=(n.name+' '+n.fields.map(f=>f.k+' '+f.v).join(' ')+' '+(n.warn||[]).join(' ')+' '+(n.sits||[]).map(s=>s.name+' '+s.steps.map(q=>q.t).join(' ')).join(' ')+' '+(n.boards||[]).map(r=>(r.model||'')+' '+(r.year||'')+' '+r.board).join(' ')+' '+(n.remote?n.remote.fields.map(f=>f.k+' '+f.v).join(' '):'')+' '+(n.remotes||[]).map(r=>r.src+' '+r.name+' '+r.notes).join(' ')).toLowerCase();if(txt.includes(q))out.push(t);if(out.length>=50)return;find(n.kids,q,t,out)}}
