<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vehicle Archive</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg"><meta name="theme-color" content="#111111">
<style>
:root{color-scheme:light dark;--bg:#f6f3ec;--card:#fff;--tx:#1c1a14;--mu:#7a7364;--ac:#b8912f;--onac:#fff;--bd:#ddd5c2;--dg:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--card:#1c1b18;--tx:#f1ece0;--mu:#9a927f;--ac:#d4af37;--onac:#111;--bd:#35322a;--dg:#ff8a80}}
:root[data-theme="dark"]{--bg:#111;--card:#1c1b18;--tx:#f1ece0;--mu:#9a927f;--ac:#d4af37;--onac:#111;--bd:#35322a;--dg:#ff8a80}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 14px 40px}
.w{max-width:900px;margin:0 auto}
header{padding:14px 0 8px}h1{margin:0 0 8px;font-size:22px;color:var(--ac);letter-spacing:.3px}
h2{margin:0;font-size:20px}h3{margin:16px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--mu)}
input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px}
textarea{resize:vertical}
button,.btn{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 14px;cursor:pointer;display:inline-block}
button.pri{background:var(--ac);color:var(--onac);border-color:var(--ac);font-weight:600}
.dg{color:var(--dg)}nav{margin:8px 0 12px;color:var(--mu);font-size:14px}nav a{color:var(--ac);cursor:pointer;font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.fld{display:grid;grid-template-columns:minmax(90px,32%) 1fr auto;gap:8px;margin-bottom:8px;align-items:start}
.x{padding:9px 12px}
.ph{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.ph img{width:92px;height:92px;object-fit:cover;border-radius:10px;border:1px solid var(--bd);cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:76px}
.tile b{font-size:16px}.tile small{color:var(--mu)}.tile button{margin-top:auto;padding:5px 8px;font-size:13px;align-self:flex-start}
.res{padding:10px 12px;border:1px solid var(--bd);background:var(--card);border-radius:10px;margin-bottom:8px;cursor:pointer}.res small{color:var(--mu);display:block}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}.ov[hidden]{display:none}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}
.box img{max-width:100%;max-height:70vh;border-radius:8px;align-self:center}
.empty{color:var(--mu);padding:8px 0}.dsum{cursor:pointer;color:var(--ac);font-weight:600;margin:6px 0 10px}.pf{position:relative;overflow:hidden;margin:0 8px 8px 0}.pf input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:0;padding:0;border:0}.lg{border-radius:50%;object-fit:contain;background:#fff;flex:none}select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px}.lab{margin:12px 0 4px;color:var(--mu);font-size:14px}.warn{border:2px solid var(--dg);border-radius:12px;padding:10px;margin:12px 0;background:rgba(179,38,30,.08)}.warn b{color:var(--dg)}.step{border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:10px}.tw{overflow-x:auto;margin-bottom:12px}table{border-collapse:collapse;width:100%;min-width:640px}th{text-align:left;font-size:13px;color:var(--mu);padding:6px}td{padding:6px;vertical-align:top;border-top:1px solid var(--bd)}td img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);display:block;margin-bottom:6px;cursor:pointer}td select,td input:not([type=file]){min-width:110px}
</style></head><body><div class="w">
<header><div class="row" style="margin-bottom:8px"><img id="alogo" hidden alt="" style="height:48px;width:auto;max-width:140px;object-fit:contain"><h1 id="ttl" style="margin:0">Vehicle Archive</h1></div><input id="q" type="search" placeholder="Search brand, model, key, chip…" autocomplete="off"><div class="row" style="margin-top:8px"><button data-a="set">⚙ Settings</button><small id="bs" style="color:var(--mu)"></small></div></header>
<div id="app"></div></div>
<div class="ov" id="dlg" hidden></div><div class="ov" id="lb" hidden></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LV=['brand','model','year'],LP=['Brands','Models','Years'];
const TPL=['Key type','Chip / Transponder','Frequency','Notes'];
const CAT="Audi:80,90,100,A1,A2,A3,A4,A5,A6,A7,A8,Allroad,e-tron,e-tron GT,Q2,Q3,Q4 e-tron,Q5,Q7,Q8,R8,RS3,RS4,RS5,RS6,RS7,S3,S4,S5,S6,S7,S8,SQ5,SQ7,TT|BMW:1 Series,2 Series,3 Series,4 Series,5 Series,6 Series,7 Series,8 Series,i3,i4,i7,iX,M2,M3,M4,M5,X1,X2,X3,X4,X5,X6,X7,Z3,Z4|Mercedes-Benz:A-Class,B-Class,C-Class,CLA,CLS,E-Class,G-Class,GLA,GLB,GLC,GLE,GLK,GLS,ML,R-Class,S-Class,SL,SLK,Sprinter,V-Class,Viano,Vito|Volkswagen:Amarok,Arteon,Beetle,Caddy,Crafter,Golf,ID.4,Jetta,Passat,Polo,Scirocco,T-Roc,Tiguan,Touareg,Touran,Transporter,Up|Land Rover:Defender,Discovery,Discovery Sport,Freelander,Range Rover,Range Rover Evoque,Range Rover Sport,Range Rover Velar|Porsche:718 Boxster,718 Cayman,911,Boxster,Cayenne,Cayman,Macan,Panamera,Taycan|Volvo:C30,S40,S60,S80,S90,V40,V60,V70,V90,XC40,XC60,XC70,XC90|Jaguar:E-Pace,F-Pace,F-Type,I-Pace,S-Type,X-Type,XE,XF,XJ|Mini:Clubman,Cooper,Countryman,Paceman|Alfa Romeo:147,156,159,Giulia,Giulietta,MiTo,Stelvio|Maserati:Ghibli,GranTurismo,Levante,Quattroporte|Bentley:Bentayga,Continental GT,Flying Spur|Peugeot:206,207,208,307,308,508,3008,5008,Boxer,Partner|Renault:Captur,Clio,Kangoo,Master,Megane,Trafic|Toyota:Aqua,Camry,Corolla,Hiace,Highlander,Hilux,Land Cruiser,Prado,Prius,RAV4,Yaris|Ford:Everest,Falcon,Fiesta,Focus,Mustang,Ranger,Territory,Transit|Holden:Barina,Captiva,Colorado,Commodore,Cruze|Honda:Accord,Civic,CR-V,HR-V,Jazz|Hyundai:i30,iLoad,Kona,Santa Fe,Tucson|Isuzu:D-Max,MU-X|Kia:Carnival,Cerato,Rio,Sorento,Sportage|Lexus:GS,IS,LS,LX,NX,RX|Mazda:BT-50,CX-3,CX-5,CX-9,Mazda2,Mazda3,Mazda6|Mitsubishi:ASX,Lancer,Outlander,Pajero,Triton|Nissan:Juke,Leaf,Navara,Patrol,Qashqai,X-Trail|Subaru:Forester,Impreza,Legacy,Outback,WRX,XV|Suzuki:Jimny,Swift,Vitara";
function mergeCat(){CAT.split('|').forEach(s=>{const p=s.split(':'),b=p[0];let br=db.brands.find(x=>x.name.toLowerCase()===b.toLowerCase());if(!br){br=mk(b,[['Notes']]);db.brands.push(br)}p[1].split(',').forEach(n=>{if(!br.kids.some(x=>x.name.toLowerCase()===n.toLowerCase()))br.kids.push(mk(n,[['Notes']]))})});db.cat=2}
let db={brands:[]},path=[],ctx=null,view='',bflt='',rflt='',ret=null;
const mk=(name,f)=>({id:uid(),name,fields:(f||[]).map(x=>({k:x[0],v:x[1]||''})),photos:[],kids:[]});
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('vehicle-archive',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function load(){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get('db');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
let sv=0;function save(){clearTimeout(sv);sv=setTimeout(async()=>{try{const d=await idb();d.transaction('kv','readwrite').objectStore('kv').put(db,'db')}catch(e){}},400)}
function seed(){
 const y=mk('2010',[['Key type','Example: proximity key, 4 buttons'],['Chip / Transponder','Example: write the chip here'],['Frequency','Example: 433 MHz'],['Procedure','Example: steps you followed and tools used'],['Notes','This is an example entry. Edit or delete it.']]);
 const m=mk('C-Class (W204)',[['Notes']]);m.kids.push(y);
 const b=mk('Mercedes-Benz',[['Notes']]);b.kids.push(m);
 db.brands=[b,...['BMW','Audi','Volkswagen','Land Rover','Porsche','Volvo'].map(n=>mk(n,[['Notes']]))];
}
async function backup(){const s=$('#bs');try{const d=new Date().toISOString().slice(0,10),b=new Blob([JSON.stringify({app:'vehicle-archive',v:1,db})],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='vehicle-archive-backup-'+d+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);db.lastBackup=d;save();s.textContent='Backup saved to Downloads: '+d;render()}catch(e){s.textContent='Backup failed'}}
function restore(t){const f=t.files[0];t.value='';if(!f)return;const fr=new FileReader();fr.onload=()=>{let o;try{o=JSON.parse(fr.result)}catch(e){}const nd=o&&o.db&&Array.isArray(o.db.brands)?o.db:null;if(!nd){dlg('That file is not a Vehicle Archive backup.',null,()=>{},'OK');return}dlg('Replace everything in the app with this backup?',null,()=>{db=nd;migrateBoards();path=[];$('#q').value='';upd();$('#bs').textContent='Backup restored'},'Replace')};fr.readAsText(f)}
const S=()=>db.set=Object.assign({title:'Vehicle Archive',theme:'auto',photo:1000,days:7,tpl:[...TPL]},db.set||{});
function applyTheme(){document.documentElement.setAttribute('data-theme',S().theme==='auto'?'':S().theme)}
function stats(){let b=db.brands.length,m=0,y=0,p=0;db.brands.forEach(x=>{m+=x.kids.length;p+=x.photos.length+(x.remote?x.remote.photos.length:0);x.kids.forEach(k=>{y+=k.kids.length;p+=k.photos.length;k.kids.forEach(z=>{p+=z.photos.length;(z.remotes||[]).forEach(r=>p+=r.photos.length);(z.boards||[]).forEach(r=>p+=r.photo?1:0);(z.sits||[]).forEach(s=>s.steps.forEach(q=>p+=q.photos.length))})})});return{b,m,y,p,mb:(JSON.stringify(db).length/1048576).toFixed(1)}}
function due(){const dd=S().days;if(!dd)return false;const t=stats();if(!t.y&&!t.p)return false;const l=db.lastBackup;return !l||(Date.now()-new Date(l))/864e5>=dd}
function settingsView(){const s=S(),t=stats(),opt=(v,l,c)=>`<option value="${v}"${String(c)===String(v)?' selected':''}>${l}</option>`;
 return `<button class="pri" data-a="sb">← Back</button><h2 style="margin:12px 0">Settings</h2>
<section class="card"><h3 style="margin-top:0">General</h3><div class="lab">App name</div><input data-s="title" value="${esc(s.title)}"><div class="lab">Your logo (shown at the top)</div><div class="row">${s.logo?'<img src="'+s.logo+'" alt="" style="height:48px;width:auto;max-width:140px;object-fit:contain">':''}<label class="btn pf" style="margin:0">${s.logo?'Change logo':'Upload logo'}<input type="file" accept="image/*" data-a="pa"></label>${s.logo?'<button class="dg" data-a="ar">Remove</button>':''}</div><div class="lab">Theme</div><select data-s="theme">${opt('auto','Automatic',s.theme)}${opt('light','Light',s.theme)}${opt('dark','Dark',s.theme)}</select><div class="lab">Photo quality (new photos only)</div><select data-s="photo">${opt(700,'Small (saves space)',s.photo)}${opt(1000,'Normal',s.photo)}${opt(1600,'High',s.photo)}</select></section>
<section class="card"><h3 style="margin-top:0">Default fields for new years</h3>${s.tpl.map((f,i)=>`<div class="fld" style="grid-template-columns:1fr auto"><input data-a="tk" data-i="${i}" value="${esc(f)}"><button class="x dg" data-a="td" data-i="${i}">×</button></div>`).join('')}<button data-a="ta">+ Add field</button><div class="lab">Used for each new year you add. Existing years are not changed.</div></section>
<section class="card"><h3 style="margin-top:0">Backup</h3><div class="row"><button class="pri" data-a="bk">⬇ Backup</button><label class="btn pf" style="margin:0">⬆ Restore<input type="file" accept=".json,application/json" data-a="rs"></label></div><p>${db.lastBackup?'Last backup: '+esc(db.lastBackup):'No backup yet.'}</p><div class="lab">Remind me to back up</div><select data-s="days">${opt(0,'Never',s.days)}${opt(3,'Every 3 days',s.days)}${opt(7,'Every week',s.days)}${opt(30,'Every month',s.days)}</select></section>
<section class="card"><h3 style="margin-top:0">Data</h3><p>${t.b} brands · ${t.m} models · ${t.y} years · ${t.p} photos · about ${t.mb} MB</p><div class="row"><button data-a="common">Restore brands &amp; models</button><button class="dg" data-a="wipe">Delete all data</button></div></section>`}
function ensure(n){n.warn=n.warn||[];if(!n.sits)n.sits=[{name:'Key copy (key available)',steps:[]},{name:'All keys lost',steps:[]}];n.cur=Math.min(n.cur||0,n.sits.length-1)}
function warnView(n){ensure(n);return `<div class="warn"><b>⚠ Warnings</b>${n.warn.map((w,i)=>`<div class="fld" style="grid-template-columns:1fr auto;margin-top:8px"><textarea data-a="wv" data-i="${i}" rows="2" placeholder="e.g. Do not do X, it locks the module">${esc(w)}</textarea><button class="x dg" data-a="wd" data-i="${i}">×</button></div>`).join('')}<div style="margin-top:8px"><button data-a="wa">+ Add warning</button></div></div>`}
function sitView(n){ensure(n);const s=n.sits[n.cur];
 return `<h3>Situations &amp; steps</h3><div class="row" style="margin-bottom:8px">${n.sits.map((x,i)=>`<button class="${i===n.cur?'pri':''}" data-a="ts" data-i="${i}">${esc(x.name)}</button>`).join('')}<button data-a="tadd">+</button></div>
<div class="row" style="margin-bottom:8px"><input data-a="tn" value="${esc(s.name)}" style="flex:1;min-width:150px;width:auto" placeholder="Situation name">${n.sits.length>1?'<button class="dg" data-a="tdel">Delete situation</button>':''}</div>
${s.steps.map((p,j)=>`<div class="step"><div class="row"><b>Step ${j+1}</b><span class="sp"></span><button class="x" data-a="nu" data-j="${j}">↑</button><button class="x" data-a="nm" data-j="${j}">↓</button><button class="x dg" data-a="nx" data-j="${j}">×</button></div><textarea data-a="nt" data-j="${j}" rows="3" placeholder="What do you do in this step?" style="margin:8px 0">${esc(p.t)}</textarea><div class="ph">${p.photos.map((q,k)=>`<img src="${q}" alt="" data-a="nv" data-j="${j}" data-k="${k}">`).join('')}</div><label class="btn pf">+ Photos<input type="file" accept="image/*" multiple data-a="nf" data-j="${j}"></label><label class="btn pf">📷 Take<input type="file" accept="image/*" capture="environment" data-a="nf" data-j="${j}"></label></div>`).join('')||'<div class="empty">No steps yet.</div>'}
<button data-a="ns">+ Add step</button>`}
function rem(b){b.remote=b.remote||{fields:[{k:'Notes',v:''}],photos:[]};return b.remote}
function remSec(n){n.remotes=n.remotes||[];return `<h3>Remote</h3>${n.remotes.map((r,i)=>`<div class="step"><div class="row"><b>Remote ${i+1}</b><span class="sp"></span><button class="x dg" data-a="yd" data-i="${i}">×</button></div><div class="row" style="margin:8px 0"><select data-a="ys" data-i="${i}" style="width:auto;flex:none">${['','KD','Xhorse','Autel','Other'].map(s=>`<option value="${s}"${r.src===s?' selected':''}>${s||'App / brand…'}</option>`).join('')}</select><input data-a="yn" data-i="${i}" value="${esc(r.name)}" placeholder="Remote name / number" style="flex:1;min-width:140px;width:auto"></div><textarea data-a="yt" data-i="${i}" rows="2" placeholder="Notes (frequency, chip, how it was programmed…)">${esc(r.notes)}</textarea><div class="ph" style="margin-top:8px">${r.photos.map((p,k)=>`<img src="${p}" alt="" data-a="yv" data-i="${i}" data-k="${k}">`).join('')}</div><label class="btn pf">+ Photos<input type="file" accept="image/*" multiple data-a="yf" data-i="${i}"></label><label class="btn pf">📷 Take<input type="file" accept="image/*" capture="environment" data-a="yf" data-i="${i}"></label></div>`).join('')}<button data-a="ya">+ Add remote</button>`}
function allRemotes(b){const out=[];sorted(b.kids,1).forEach(m=>sorted(m.kids,2).forEach(y=>(y.remotes||[]).forEach((r,ri)=>out.push({m,y,r,ri}))));return out}
function remoteView(b){const f=rflt.toLowerCase(),all=allRemotes(b),list=all.filter(x=>!f||(x.m.name+' '+x.y.name+' '+x.r.name+' '+x.r.src+' '+x.r.notes).toLowerCase().includes(f)),o=b.remote&&(b.remote.photos.length||b.remote.fields.some(z=>z.v.trim()));
 return `<button class="pri" data-a="rb">← Back</button><div class="row" style="margin:12px 0">${badge(b,40)}<h2>${esc(b.name)} · Remotes</h2></div>
<input id="rf" placeholder="Filter by model, year, remote name or app…" value="${esc(rflt)}" style="margin-bottom:10px">
<div class="empty">${all.length} remote${all.length===1?'':'s'} saved in ${esc(b.name)}. Add them inside each year, in the Remote section.</div>
<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr))">${list.map(({m,y,r,ri})=>`<div class="tile" style="cursor:default"><small>${esc(m.name)} › ${esc(y.name)}</small><b>${esc(r.name||'(no name)')}</b>${r.src?'<small>'+esc(r.src)+'</small>':''}<div class="ph" style="margin:4px 0">${r.photos.map((p,k)=>`<img src="${p}" alt="" data-a="xv" data-m="${m.id}" data-y="${y.id}" data-r="${ri}" data-k="${k}">`).join('')}</div>${r.notes?'<small>'+esc(r.notes)+'</small>':''}<div class="row" style="margin-top:auto"><button data-a="xo" data-m="${m.id}" data-y="${y.id}">Open year</button><button class="dg" data-a="xd" data-m="${m.id}" data-y="${y.id}" data-r="${ri}">Delete</button></div></div>`).join('')||'<div class="empty">Nothing found.</div>'}</div>
${o?`<details><summary class="dsum">Old brand notes (first Remote page)</summary>${(()=>{const s=oldRemote(b);return s.slice(s.indexOf('<section'))})()}</details>`:''}`}
function oldRemote(b){const r=rem(b);return `<button class="pri" data-a="rb">← Back</button><div class="row" style="margin:12px 0">${badge(b,40)}<h2>${esc(b.name)} · Remote</h2></div>
<section class="card"><h3 style="margin-top:0">Fields</h3>${r.fields.map((f,i)=>`<div class="fld"><input data-a="rk" data-i="${i}" value="${esc(f.k)}" placeholder="Field name"><textarea data-a="rv" data-i="${i}" rows="2" placeholder="Write here…">${esc(f.v)}</textarea><button class="x dg" data-a="rd" data-i="${i}">×</button></div>`).join('')||'<div class="empty">No fields yet.</div>'}<button data-a="ra">+ Add field</button>
<h3>Photos</h3><div class="ph">${r.photos.map((p,i)=>`<img src="${p}" alt="" data-a="rpv" data-i="${i}">`).join('')}</div><label class="btn pf">+ Add photos<input type="file" accept="image/*" multiple data-a="rpf"></label><label class="btn pf">📷 Take photo<input type="file" accept="image/*" capture="environment" data-a="rpf"></label></section>`}
function gy(b,m,y){const mm=b&&b.kids.find(x=>x.id===m);return mm&&mm.kids.find(x=>x.id===y)}
function migrateBoards(){let mv=0;db.brands.forEach(b=>{if(!b.boards)return;b.boards=b.boards.filter(r=>{const m=b.kids.find(x=>x.name===r.model),yn=(r.year||'').trim();if(!m||!yn)return true;let y=m.kids.find(x=>x.name.toLowerCase()===yn.toLowerCase());if(!y){y=mk(yn,S().tpl.map(x=>[x]));m.kids.push(y)}y.boards=y.boards||[];y.boards.push({board:r.board||'',photo:r.photo||''});mv++;return false})});if(mv)save()}
function allBoards(b){const out=[];sorted(b.kids,1).forEach(m=>sorted(m.kids,2).forEach(y=>(y.boards||[]).forEach((r,i)=>out.push({m,y,r,i}))));return out}
